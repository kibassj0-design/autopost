<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autopost</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1216;
         color: #e8eaed; font: 16px/1.7 "Segoe UI", Tahoma, sans-serif; padding: 16px; box-sizing: border-box; }
  .card { max-width: 560px; width: 100%; background: #171b21; border: 1px solid #2a323c;
          border-radius: 14px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #97a1ad; margin: 0 0 16px; }
  textarea { width: 100%; box-sizing: border-box; direction: ltr; background: #1e242c; color: #e8eaed;
             border: 1px solid #2a323c; border-radius: 8px; padding: 10px; font: 13px Consolas, monospace;
             height: 90px; resize: none; }
  button { margin-top: 12px; background: #4f8cff; color: #fff; border: 0; border-radius: 8px;
           padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  .ok { color: #3ecf8e; margin-inline-start: 10px; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">autopost</h1>
  <p id="hint">هذه الصفحة هي عنوان الرجوع (Redirect URI) لربط تيك توك بأداة autopost.</p>
  <div id="box" hidden>
    <textarea id="url" readonly></textarea>
    <button id="copy">نسخ</button><span id="done" class="ok"></span>
  </div>
</div>
<script>
  // TikTok sends the user back here with ?code=...; the app needs this whole address.
  if (new URLSearchParams(location.search).has("code")) {
    document.getElementById("title").textContent = "تمت الموافقة";
    document.getElementById("hint").textContent =
      "انسخ هذا العنوان والصقه في أداة autopost، في خانة «إكمال الربط» تحت تيك توك.";
    const box = document.getElementById("box"), url = document.getElementById("url");
    box.hidden = false;
    url.value = location.href;
    url.select();
    document.getElementById("copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(location.href); }
      catch (e) { url.select(); document.execCommand("copy"); }
      document.getElementById("done").textContent = "تم النسخ";
    });
  }
</script>
</body>
</html>
